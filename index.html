<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育児・介護サポート比較</title>
  <link rel="stylesheet" href="index-style.css">
</head>
<body>

  <header>サポートサービス比較</header>

  <div class="container">
    <div class="filter-tags">
      <button class="tag active">すべて</button>
      <button class="tag">一時保育</button>
      <button class="tag">病児保育</button>
      <button class="tag">訪問看護・介護</button>
    </div>

    <div class="card-list">
      <div class="card">
        <div class="card-header" style="background-color: #FFE082;">🧸 一時保育</div>
        <div class="card-body">
          <div class="card-title">すまいるキッズ保育園（一時預かり）</div>
          <div class="card-info">📍 東京都板橋区 / 営業時間: 8:30〜17:00<br>★ 4.8 (12件の口コミ)</div>
          <div class="card-price">¥1,200 / 1時間</div>
          <button class="btn-reserve" onclick="reserveService('すまいるキッズ保育園', '1,200')">このプランを予約する</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header" style="background-color: #81D4FA;">🚑 病児保育フォトイメージ</div>
        <div class="card-body">
          <div class="card-title">エンゼルサポート（病児対応）</div>
          <div class="card-info">📍 東京都板橋区 / 当日予約OK<br>★ 4.9 (28件の口コミ)</div>
          <div class="card-price">¥2,000 / 1時間</div>
          <button class="btn-reserve" onclick="reserveService('エンゼルサポート', '2,000')">このプランを予約する</button>
        </div>
      </div>
    </div>
  </div>

  <script src="index-script.js"></script>
</body>
</html>
