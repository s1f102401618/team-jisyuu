<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育児・介護サポート比較</title>
  <style>
    :root {
      --primary: #06C755; /* LINEカラー */
      --bg: #F5F6F8;
      --card-bg: #FFFFFF;
      --text: #111111;
      --sub-text: #666666;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 検索・絞り込みタグ */
    .filter-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tag {
      background: #EAEAEA;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .tag.active {
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    /* サービスカード */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      height: 120px;
      background-color: #DDD;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-weight: bold;
    }

    .card-body {
      padding: 16px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 0 0 8px 0;
    }

    .card-info {
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #E53935;
      margin-bottom: 12px;
    }

    .btn-reserve {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-reserve:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>サポートサービス比較</header>

  <div class="container">
    <!-- カテゴリ選択ボタン -->
    <div class="filter-tags">
      <button class="tag active">すべて</button>
      <button class="tag">一時保育</button>
      <button class="tag">病児保育</button>
      <button class="tag">訪問看護・介護</button>
    </div>

    <!-- サービス一覧 -->
    <div class="card-list">
      
      <!-- カード1 -->
      <div class="card">
        <div class="card-header" style="background-color: #FFE082;">🧸 一時保育フォトイメージ</div>
        <div class="card-body">
          <div class="card-title">すまいるキッズ保育園（一時預かり）</div>
          <div class="card-info">📍 東京都板橋区 / 営業時間: 8:30〜17:00<br>★ 4.8 (12件の口コミ)</div>
          <div class="card-price">¥1,200 / 1時間</div>
          <button class="btn-reserve" onclick="selectService('すまいるキッズ保育園')">日程を選んで予約</button>
        </div>
      </div>

      <!-- カード2 -->
      <div class="card">
        <div class="card-header" style="background-color: #81D4FA;">🚑 病児保育フォトイメージ</div>
        <div class="card-body">
          <div class="card-title">エンゼルサポート（病児対応）</div>
          <div class="card-info">📍 東京都板橋区 / 当日予約OK<br>★ 4.9 (28件の口コミ)</div>
          <div class="card-price">¥2,000 / 1時間</div>
          <button class="btn-reserve" onclick="selectService('エンゼルサポート')">日程を選んで予約</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    function selectService(name) {
      alert(name + ' の予約画面へ進みます（プロトタイプ）');
    }
  </script>
</body>
</html>
